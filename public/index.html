<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ജീവിതപങ്കാളി ജ്യോതിഷം – മലയാളം വിവാഹ ജ്യോതിഷ ചാറ്റ്ബോട്ട്</title>
  <meta name="description" content="നിങ്ങളുടെ ഭാവി ജീവിതപങ്കാളി ആരായിരിക്കും? സ്വഭാവം, ജോലി, സ്ഥലം, പ്രണയവിവാഹമോ നിശ്ചയിച്ച വിവാഹമോ, വിവാഹസമയം, പൊരുത്തം – മലയാളത്തിൽ.">
  <meta name="theme-color" content="#2a1240">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">💞</span>
        <div>
          <h1>ജീവിതപങ്കാളി ജ്യോതിഷം</h1>
          <p>വിവാഹവും ബന്ധങ്ങളും – വേദജ്യോതിഷ ചാറ്റ്ബോട്ട്</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="ghost" id="btn-menu" type="button">ചോദ്യങ്ങൾ</button>
        <button class="ghost" id="btn-edit" type="button">വിവരങ്ങൾ മാറ്റുക</button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <form id="composer" class="composer" hidden>
      <textarea id="composer-input" rows="1" maxlength="500" placeholder="നിങ്ങളുടെ ചോദ്യം ഇവിടെ എഴുതുക…"></textarea>
      <button type="submit" class="primary">അയയ്ക്കുക</button>
    </form>
  </div>
  <script src="/app.js"></script>
</body>
</html>
